name: Recover v0.38.0 original GitHub Release
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: release-refs/tags/v0.38.0
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71de293c818f757fec6267b6d5d2ce7e7dc690fc
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore and verify original artifact without republishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 71de293c818f757fec6267b6d5d2ce7e7dc690fc
          test "$(git rev-parse v0.38.0)" = 71de293c818f757fec6267b6d5d2ce7e7dc690fc
          gh run download 37936577727 --name release-v0.38.0-37936577727 --dir release
          (cd release && sha256sum -c SHA256SUMS.txt)
          echo '523b329a87f38eaa442bdd90a826d9347e51425b76bd1eed02b0e156d0083c86  release/feng0531-dsh-code-review-0.38.0.tgz' | sha256sum -c -
          node scripts/verify-published.mjs
      - name: Complete Release only after actual registry verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create v0.38.0 release/*.tgz release/SHA256SUMS.txt --verify-tag --title v0.38.0 --generate-notes
